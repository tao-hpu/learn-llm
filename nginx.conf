server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 反代在 Caddy 后面：301 用相对地址，避免跳到容器内的 http://host:80
    absolute_redirect off;

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 旧的单文件地址。301 不带 hash，浏览器会把原来的 #step-N 接到新地址上。
    location = /index.html { return 301 /; }
    location = /glossary.html { return 301 /glossary; }
    location = /notes.html { return 301 /notes; }
    location = /about.html { return 301 /about; }
    location = /01_bigram_crossentropy_viz.html { return 301 /ch/bigram; }
    location = /02_attention_viz.html { return 301 /ch/attention; }
    location = /03_transformer_viz.html { return 301 /ch/transformer; }
    location = /04_gpt_machine_viz.html { return 301 /ch/gpt-machine; }
    location = /05_sampling_viz.html { return 301 /ch/sampling; }
    location = /07_pretraining_viz.html { return 301 /ch/pretraining; }
    location = /06_posttraining_viz.html { return 301 /ch/posttraining; }
    location = /08_sft_viz.html { return 301 /ch/sft; }
    location = /09_lora_viz.html { return 301 /ch/lora; }
    location = /10_dpo_viz.html { return 301 /ch/dpo; }
    location = /11_moe_viz.html { return 301 /ch/moe; }
    location = /12_llama_viz.html { return 301 /ch/llama; }
    location = /13_linear_attention_viz.html { return 301 /ch/linear-attention; }
    location = /14_sparse_attention_viz.html { return 301 /ch/sparse-attention; }
    location = /15_ngram_memory_viz.html { return 301 /ch/ngram-memory; }
    location = /16_speculative_decoding_viz.html { return 301 /ch/speculative-decoding; }
    location = /17_quantization_viz.html { return 301 /ch/quantization; }
    location = /18_bpe_viz.html { return 301 /ch/bpe; }
    location = /19_flash_attention_viz.html { return 301 /ch/flash-attention; }
    location = /20_scaling_law_viz.html { return 301 /ch/scaling-law; }
    location = /21_rlvr_grpo_viz.html { return 301 /ch/rlvr-grpo; }

    # 未知路径以 404 状态返回 404.html（构建期预渲染的 404 页，带 noindex），前端接管后同样显示 404。
    # 不能 try_files 到 /index.html：上面的 location = /index.html 会把这次内部跳转也 301 到首页。
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
}

